<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Faraja</title><link rel="stylesheet" href="/css/style.css"></head><body class="login"><section class="login-card"><div class="brand">✚ <b>Faraja</b><small>DISPENSARY</small></div><p class="eyebrow">STAFF ACCESS</p><h1>Welcome back.</h1><p>Sign in to care for your patients.</p><p id="error" role="alert"></p><form action="/login" method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><input type="hidden" name="_csrf" id="csrf"><button>Sign in →</button></form><small>Authorized Faraja staff only</small></section><script>if(location.search.includes("error"))document.querySelector("#error").textContent="Incorrect username or password";fetch("/api/csrf").then(r=>r.json()).then(d=>document.querySelector("#csrf").value=d.token).catch(()=>document.querySelector("#error").textContent="Server unavailable");</script></body></html>
